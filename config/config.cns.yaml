# neuView Configuration
neuprint:
  server: "neuprint.janelia.org"
  dataset: "male-cns:v1.0"

output:
  directory: "output"

neuroglancer:
  base_url: "https://neuroglancer-demo.appspot.com/"
  template: "neuroglancer-cns.js.jinja"
  # Per-neuron downloads offered next to the Neuroglancer view. URLs go through
  # the GCS JSON API so the browser gets CORS headers (the plain
  # storage.googleapis.com URLs have none). SWC coordinates are 8 nm voxels,
  # mesh vertices are nanometers.
  download_formats:
    - key: swc
      label: "SWC skeleton (coarse, ~16 KB per neuron)"
      kind: swc
      url_template: "https://www.googleapis.com/storage/v1/b/flyem-male-cns/o/v1.0%2Fsegmentation%2Fskeletons-malecns%2Fskeletons-swc%2F{body_id}.swc?alt=media"
    - key: swc-highres
      label: "SWC skeleton (high resolution, ~300 KB per neuron)"
      kind: swc
      url_template: "https://www.googleapis.com/storage/v1/b/flyem-male-cns/o/v1.0%2Fsegmentation%2Fskeletons-malecns%2Fskeletons-highres-swc%2F{body_id}.swc?alt=media"
    - key: obj
      label: "OBJ mesh (converted from the Neuroglancer mesh, ~3 MB per neuron)"
      kind: ngmesh
      url_template: "https://www.googleapis.com/storage/v1/b/flyem-male-cns/o/v1.0%2Fsegmentation%2Fsingle-res-meshes%2F{body_id}:0?alt=media"

# Auto-discovery settings for neuron types
discovery:
  # Number of neuron types to select and generate pages for
  max_types: 10
  # Pattern to filter neuron types (regex, optional)
  type_filter: ""
  # Exclude these neuron types (exact matches)
  exclude_types: []
  # Include only these specific types (if specified, overrides discovery)
  include_only: []
  # Randomize selection (true) or use alphabetical order (false)
  randomize: true

html:
  title_prefix: "Male CNS"
  github_repo: "https://github.com/reiserlab/celltype-explorer-drosophila-male-cns"
  youtube_channel: "https://www.youtube.com/@ReiserLab"
  fathom_id: "LNLMYXNK"

